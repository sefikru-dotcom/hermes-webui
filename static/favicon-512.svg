<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="mars-outer-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feGaussianBlur stdDeviation="6" result="sharp"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="sharp"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="mars-corona" cx="62%" cy="38%" r="65%">
      <stop offset="0%" stop-color="rgba(255, 68, 68, 0.45)"/>
      <stop offset="40%" stop-color="rgba(211, 47, 47, 0.25)"/>
      <stop offset="70%" stop-color="rgba(183, 28, 28, 0.10)"/>
      <stop offset="100%" stop-color="rgba(139, 0, 0, 0)"/>
    </radialGradient>

    <radialGradient id="mars-surface-light" cx="65%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="18%" stop-color="#ff5252"/>
      <stop offset="42%" stop-color="#d32f2f"/>
      <stop offset="68%" stop-color="#8a1010"/>
      <stop offset="88%" stop-color="#3b0404"/>
      <stop offset="100%" stop-color="#120101"/>
    </radialGradient>

    <radialGradient id="mars-atmospheric-limb" cx="68%" cy="28%" r="62%">
      <stop offset="84%" stop-color="rgba(255, 82, 82, 0)"/>
      <stop offset="93%" stop-color="rgba(255, 110, 64, 0.55)"/>
      <stop offset="98%" stop-color="rgba(255, 61, 0, 0.90)"/>
      <stop offset="100%" stop-color="rgba(255, 138, 101, 1)"/>
    </radialGradient>

    <linearGradient id="mars-north-pole" x1="45%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 245, 245, 0.90)"/>
      <stop offset="50%" stop-color="rgba(255, 205, 210, 0.45)"/>
      <stop offset="100%" stop-color="rgba(255, 205, 210, 0)"/>
    </linearGradient>

    <radialGradient id="mars-night-shadow" cx="28%" cy="72%" r="60%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.88)"/>
      <stop offset="55%" stop-color="rgba(0, 0, 0, 0.65)"/>
      <stop offset="85%" stop-color="rgba(0, 0, 0, 0.15)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="226" fill="url(#mars-corona)" filter="url(#mars-outer-glow)"/>

  <g class="mars-planet-body">
    <circle cx="256" cy="256" r="196" fill="url(#mars-surface-light)"/>

    <path d="M 175 240 Q 235 270 305 255 Q 365 270 410 248 Q 355 285 285 272 Q 220 290 175 240 Z" fill="#240303" opacity="0.55"/>
    <path d="M 220 275 Q 275 295 340 280 Q 295 308 230 295 Z" fill="#180101" opacity="0.65"/>
    <path d="M 145 200 Q 190 185 225 205 Q 180 220 145 200 Z" fill="#2a0404" opacity="0.45"/>
    <path d="M 280 170 Q 330 155 375 178 Q 330 195 280 170 Z" fill="#240303" opacity="0.40"/>
    <path d="M 190 320 Q 250 345 320 330 Q 260 360 190 320 Z" fill="#140101" opacity="0.70"/>

    <ellipse cx="230" cy="310" rx="28" ry="18" fill="#180202" opacity="0.5"/>
    <path d="M 210 300 Q 230 292 250 302" stroke="#ff8a80" stroke-width="1.8" fill="none" opacity="0.55"/>

    <circle cx="310" cy="220" r="14" fill="#220303" opacity="0.45"/>
    <path d="M 300 210 Q 312 206 322 214" stroke="#ffab91" stroke-width="1.4" fill="none" opacity="0.6"/>

    <circle cx="265" cy="190" r="10" fill="#280404" opacity="0.4"/>
    <path d="M 258 184 Q 266 180 274 186" stroke="#ffab91" stroke-width="1.2" fill="none" opacity="0.55"/>

    <circle cx="360" cy="235" r="8" fill="#240303" opacity="0.4"/>
    <path d="M 354 230 Q 360 227 366 231" stroke="#ffab91" stroke-width="1.0" fill="none" opacity="0.6"/>

    <path d="M 205 76 Q 256 64 307 76 Q 285 106 256 110 Q 227 106 205 76 Z" fill="url(#mars-north-pole)"/>
    <ellipse cx="256" cy="80" rx="36" ry="10" fill="rgba(255, 255, 255, 0.65)"/>

    <circle cx="256" cy="256" r="196" fill="url(#mars-night-shadow)"/>
    <circle cx="256" cy="256" r="196" fill="url(#mars-atmospheric-limb)"/>

    <path d="M 205 76 A 196 196 0 0 1 450 275" stroke="#ff5252" stroke-width="3" fill="none" opacity="0.85" filter="url(#mars-outer-glow)"/>
    <path d="M 230 68 A 196 196 0 0 1 445 230" stroke="#ff8a80" stroke-width="1.5" fill="none" opacity="0.95"/>
  </g>
</svg>